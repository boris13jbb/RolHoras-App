# Blueprint Render — API pública del SaaS (no depende del PC local).
# El panel admin se despliega en Vercel (apps/admin_web).
services:
  - type: web
    name: rolpagos-api
    runtime: python
    plan: free
    region: oregon
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DATABASE_URL
        fromDatabase:
          name: rolpagos-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: rolpagos-db
          property: connectionString

databases:
  - name: rolpagos-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
