name: Gmail reconcile

on:
  schedule:
    # Cada 6 horas (UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Reconciliar Gmail en API cloud
        env:
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL || 'https://rolpagos-api.onrender.com' }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          if [ -z "$SCHEDULER_SECRET" ]; then
            echo "Falta secret SCHEDULER_SECRET en el repo GitHub"
            exit 1
          fi
          curl -fsS -X POST \
            -H "X-Internal-Token: ${SCHEDULER_SECRET}" \
            "${API_PUBLIC_URL%/}/api/v1/internal/gmail/reconcile"
